# FILE: apps/api_gateway/backend/pyproject.toml
# MODULE: API-GATEWAY-DEPENDENCY-GROUPS
# LAYER: DATA
# PURPOSE: Structured dependency manifest with runtime and development/test groups for the backend API gateway
# DEPENDS_ON: none
# EXPOSES: project metadata and grouped dependencies for runtime, dev, and test workflows
# CRYPTO_PROVENANCE: n/a
# VERSION: v1
# TAG: [CODEX-TAG: CALEB-FEDOR-BYKER-KONEV-10271998-CODEXIMMORTAL]
